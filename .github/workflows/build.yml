name: Build Bluetooth Audio HAL
"on":
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt clean
          docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl python3 python-is-python3 \
            bc bison flex build-essential \
            zip unzip rsync zlib1g-dev \
            libssl-dev libxml2-utils xsltproc \
            fontconfig openjdk-11-jdk

      - name: Install repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Build"

      - name: Init Lineage tree
        run: |
          mkdir android
          cd android
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --depth=1

      - name: Sync required projects
        run: |
          cd android
          repo sync \
            build \
            build/soong \
            build/blueprint \
            hardware/interfaces \
            system/core \
            system/libbase \
            system/libhidl \
            system/tools/hidl \
            device/generic/arm64 \
            device/generic/goldfish \
            -c \
            --no-tags \
            --no-clone-bundle \
            -j4 \
            --force-sync

      - name: Check disk space after sync
        run: df -h

      - name: Build Bluetooth HAL
        run: |
          cd android
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_PRODUCT=aosp_arm64
          export TARGET_BUILD_VARIANT=eng
          build/soong/soong_ui.bash \
            --make-mode \
            android.hardware.bluetooth.audio@2.1-impl

      - name: Check disk space after build
        if: always()
        run: df -h

      - name: Find output
        run: |
          cd android
          find out -name "android.hardware.bluetooth.audio@2.1-impl.so" -exec cp {} /tmp/ \;

      - name: Upload HAL
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-audio-hal-2.1-impl
          path: /tmp/android.hardware.bluetooth.audio@2.1-impl.so
          if-no-files-found: error
